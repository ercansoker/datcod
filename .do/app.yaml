# DigitalOcean App Platform — statik site tanımı
# Konsolda "Create App > GitHub > ercansoker/datcod" dediğinizde bu dosya okunur.

name: datcod-site
region: fra

static_sites:
  - name: web
    github:
      repo: ercansoker/datcod
      branch: main
      deploy_on_push: true

    # Derleme adımı yok — dosyalar olduğu gibi yayınlanır.
    source_dir: /
    output_dir: /

    index_document: index.html
    error_document: 404.html

ingress:
  rules:
    - component:
        name: web
      match:
        path:
          prefix: /

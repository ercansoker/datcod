<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sayfa bulunamadı — Datcod</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#070b16" />
  <link rel="icon" href="assets/img/favicon.png" type="image/png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />

  <style>
    .nf {
      min-height: 100vh; display: grid; place-items: center;
      background: var(--ink-900); color: #fff; text-align: center; padding: 2rem 1.5rem;
    }
    .nf-inner { max-width: 440px; }
    .nf img { height: 42px; width: auto; margin: 0 auto 2.4rem; display: block; }
    .nf h1 { font-size: 1.35rem; margin: 1rem 0 .6rem; }
    .nf p { color: rgba(255, 255, 255, .62); font-size: .95rem; margin-bottom: 2rem; }
    /* .nf p kuralından sonra gelmeli: aynı özgüllükte sonraki kural kazanır */
    .nf p.nf-code {
      font-family: var(--font-head); font-size: clamp(3.4rem, 12vw, 5rem);
      line-height: 1; letter-spacing: -.03em; margin-bottom: 0;
      background: linear-gradient(100deg, var(--cyan-300), var(--blue-600));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
  </style>
</head>
<body>
  <main class="nf">
    <div class="nf-inner">
      <img src="assets/img/logo.png" alt="Datcod — Data &amp; Code" width="681" height="201" />
      <p class="nf-code">404</p>
      <h1>Bu sayfayı bulamadık.</h1>
      <p>Aradığınız adres taşınmış veya hiç var olmamış olabilir.</p>
      <a class="btn btn-primary btn-lg" href="/">Ana sayfaya dön</a>
    </div>
  </main>
</body>
</html>
